<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>E2E with VAST ad text</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
        #fluid-player-e2e-case {
            width: 90%;
        }
    </style>
</head>
<body>

<video id="fluid-player-e2e-case">
    <source src="https://media.w3.org/2010/05/video/movie_300.mp4" title="240p" type="video/mp4"/>
</video>

<%= htmlWebpackPlugin.tags.bodyTags %>

<script>
    // ?perAd=1 adds an adText on the adList entry, which must override vastOptions.adText
    var perAd = new URLSearchParams(window.location.search).has('perAd');
    var preRoll = {
        roll: 'preRoll',
        vastTag: '/static/vast_linear_e2e.xml',
    };

    if (perAd) {
        preRoll.adText = 'Per-ad text';
    }

    var instance = fluidPlayer('fluid-player-e2e-case', {
        vastOptions: {
            adText: 'Player-wide text',
            adList: [preRoll]
        },
    });
</script>

</body>
</html>
