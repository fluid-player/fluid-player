<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <title>E2E with VPAID lifecycle</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
        #fluid-player-e2e-case {
            width: 90%;
        }
    </style>
</head>
<body>

<video id="fluid-player-e2e-case">
    <source src="/static/e2e/content_20s.webm" title="content" type="video/webm"/>
</video>

<%= htmlWebpackPlugin.tags.bodyTags %>

<script>
    var vastTag = new URLSearchParams(window.location.search).get('vastTag') || '/static/e2e/vpaid_lifecycle.xml';
    var instance = fluidPlayer('fluid-player-e2e-case', {
        vastOptions: {
            allowVPAID: true,
            adList: [
                {
                    roll: 'preRoll',
                    vastTag: vastTag,
                }
            ]
        },
    });
</script>

</body>
</html>
