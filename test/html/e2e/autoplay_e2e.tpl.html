<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Autoplay next video (FP-323)</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
        #fluid-player-e2e-case {
            width: 90%;
        }
    </style>
</head>
<body>

<video id="fluid-player-e2e-case">
    <source src="https://media.w3.org/2010/05/video/movie_300.mp4" title="240p" type="video/mp4"/>
</video>

<%= htmlWebpackPlugin.tags.bodyTags %>

<script>
    var instance = fluidPlayer('fluid-player-e2e-case', {
        suggestedVideos: {
            configUrl: '/static/suggested_videos_example_v1.json',
        },
        layoutControls: {
            autoPlayNextVideo: {
                enabled: true,
                defaultState: true,
                countdown: 3,
            },
        },
    });

    // Record Event API calls so tests can assert them.
    window.autoPlayEvents = [];
    ['autoPlayToggled', 'autoPlayCountdownStarted', 'autoPlayCancelled', 'autoPlayPlayNow', 'autoPlayCompleted']
        .forEach(function (name) {
            instance.on(name, function (event) {
                window.autoPlayEvents.push({ name: name, detail: event && event.detail });
            });
        });
</script>

</body>
</html>
