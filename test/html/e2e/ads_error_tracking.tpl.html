<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>VOD with VAST Linear - error tracking</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
        #fluid-player-e2e-case {
            width: 90%;
        }
    </style>
</head>
<body>

<p>
    <a href="?case=dead">dead</a> |
    <a href="?case=unplayable">unplayable</a> |
    <a href="?case=wrapper">wrapper</a> |
    <a href="?case=playbackerror">playbackerror</a> |
    <a href="?case=noerror">noerror</a>
</p>
<pre id="log"></pre>

<video id="fluid-player-e2e-case">
    <source src="https://cdn.fluidplayer.com/videos/valerian-480p.mkv" title="480p" type="video/mp4"/>
</video>

<%= htmlWebpackPlugin.tags.bodyTags %>

<script>
    var cases = {
        // Media file returns 404: the ad's Error URI is called with 401 and the fallback plays
        dead: { vastTag: '/static/e2e/vast_error_dead_media.xml', fallbackVastTags: ['/static/vast_linear.xml'] },
        // Media file served as video/x-flv, which the browser can't play: Error URI called with 405
        unplayable: { vastTag: '/static/e2e/vast_error_unplayable_media.xml', fallbackVastTags: ['/static/vast_linear.xml'] },
        // Dead media inside a wrapper: the Error URIs of the ad and of the wrapper are both called
        wrapper: { vastTag: '/static/e2e/vast_error_wrapper_dead_media.xml', fallbackVastTags: ['/static/vast_linear.xml'] },
        // Passes the pre-check but fails at play time: the Error URIs of the ad and of the wrapper are both called
        playbackerror: { vastTag: '/static/e2e/vast_error_wrapper_playback.xml' },
        // Working ad: no Error URI is called
        noerror: { vastTag: '/static/vast_linear.xml' },
    };
    var caseName = new URLSearchParams(location.search).get('case') || 'dead';
    var log = document.getElementById('log');
    log.textContent = 'case: ' + caseName + '\n';

    var instance = fluidPlayer('fluid-player-e2e-case', {
        vastOptions: {
            adList: [Object.assign({ roll: 'preRoll' }, cases[caseName])]
        },
    });

    instance.on('playing', function (event, info) {
        log.textContent += 'playing: ' + info.mediaSourceType + ' ' + event.target.currentSrc + '\n';
    });

    // Shows the VAST <Error> URI calls
    new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (entry) {
            if (/_error\?code=/.test(entry.name)) {
                log.textContent += 'error: ' + entry.name.replace(location.origin, '') + '\n';
            }
        });
    }).observe({ type: 'resource', buffered: true });
</script>

</body>
</html>
