<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>VOD with VAST Linear - media file validation</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
        #fluid-player-e2e-case {
            width: 90%;
        }
    </style>
</head>
<body>

<p>
    <a href="?case=nocors">nocors</a> |
    <a href="?case=dead">dead</a> |
    <a href="?case=cors">cors</a> |
    <a href="?case=unplayable">unplayable</a> |
    <a href="?case=vr">vr</a>
</p>
<pre id="log"></pre>

<video id="fluid-player-e2e-case">
    <source src="https://cdn.fluidplayer.com/videos/valerian-480p.mkv" title="480p" type="video/mp4"/>
</video>

<%= htmlWebpackPlugin.tags.bodyTags %>

<script>
    var cases = {
        // Playable creative on a CDN without Access-Control-Allow-Origin
        nocors: { vastTag: '/static/e2e/vast_linear_no_cors.xml' },
        // Cross-origin 404 without CORS headers: must still be rejected so the fallback plays
        dead: { vastTag: '/static/e2e/vast_linear_dead_media_no_cors.xml', fallbackVastTags: ['/static/vast_linear.xml'] },
        // Creative with CORS headers (jsdelivr): happy path
        cors: { vastTag: '/static/vast_linear.xml' },
        // Same-origin video/x-flv the browser can't play: must be rejected so the fallback plays
        unplayable: { vastTag: '/static/e2e/vast_linear_unplayable_type.xml', fallbackVastTags: ['/static/vast_linear.xml'] },
        // No-CORS creative in cardboard mode, where the player element has crossOrigin="anonymous"
        vr: { vastTag: '/static/e2e/vast_linear_no_cors_360.xml', fallbackVastTags: ['/static/e2e/vast_linear_360.xml'] },
    };
    var caseName = new URLSearchParams(location.search).get('case') || 'nocors';
    var log = document.getElementById('log');
    log.textContent = 'case: ' + caseName + '\n';

    var instance = fluidPlayer('fluid-player-e2e-case', {
        layoutControls: { showCardBoardView: caseName === 'vr' },
        vastOptions: {
            adList: [Object.assign({ roll: 'preRoll' }, cases[caseName])]
        },
    });

    instance.on('playing', function (event, info) {
        log.textContent += 'playing: ' + info.mediaSourceType + ' ' + event.target.currentSrc + '\n';
    });
</script>

</body>
</html>
