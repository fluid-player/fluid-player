<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fullscreen and theatre</title>
    <%= htmlWebpackPlugin.tags.headTags %>
    <style lang="css">
        #fluid-player-e2e-case {
            width: 60%;
        }
    </style>
</head>
<body>

<video id="fluid-player-e2e-case">
    <source src="https://media.w3.org/2010/05/video/movie_300.mp4" title="240p" type="video/mp4"/>
</video>

<%= htmlWebpackPlugin.tags.bodyTags %>

<script>
    var displayEvents = [];
    var instance = fluidPlayer('fluid-player-e2e-case', {
        layoutControls: {
            allowTheatre: true,
            theatreSettings: {
                width: '100%',
                height: '400px'
            }
        }
    });
    instance.on('theatreModeOn', function () { displayEvents.push('theatreModeOn'); });
    instance.on('theatreModeOff', function () { displayEvents.push('theatreModeOff'); });
</script>

</body>
</html>
